[project]
name = "navbench"
version = "1.0.0rc1"
description = "Deterministic controller-in-the-loop navigation benchmark"
requires-python = ">=3.13.15"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
navbench = "navbench.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
